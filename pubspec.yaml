name: taskflow
description: TaskFlow - Simple, organized, always updated task management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  pin_code_fields: ^8.0.1
  timeago: ^3.6.1
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
